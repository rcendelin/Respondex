name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: func-respondex-dev

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build shared
        run: pnpm --filter @respondex/shared build

      - name: Build backend
        run: pnpm --filter @respondex/backend build

      - name: Build frontend
        run: pnpm --filter @respondex/frontend build

      - name: Prepare backend deployment package
        run: |
          mkdir -p deploy-backend
          cp -r packages/backend/dist/* deploy-backend/
          cp packages/backend/host.json deploy-backend/
          cp packages/backend/package.json deploy-backend/
          cd deploy-backend
          npm install --omit=dev --ignore-scripts
          cd ..

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: packages/frontend
          output_location: dist
          skip_app_build: true

      - name: Deploy Backend to Azure Functions
        uses: Azure/functions-action@4c708484940839593f2d74df7d2767df709ac3c2 # v1.5.2
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: deploy-backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-funcignore: true
